name: Refresh dashboard data

# Runs whenever a new Excel/CSV file (or the TM master) is pushed.
on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'config/**'
      - 'build_data.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # needed to order files by commit time

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build data.json from the files in data/
        run: python build_data.py      # fails here (data.json untouched) on critical problems

      - name: Commit data.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git rm -q --cached data_issues.txt 2>/dev/null || true
          git commit -m "Refresh data.json" || echo "No change"
          git pull --rebase origin main
          git push

      - name: Report data issues
        if: always()
        run: |
          if [ -f data_issues.txt ]; then
            { echo '### ⚠️ Cash Till data check'; echo; cat data_issues.txt; } >> "$GITHUB_STEP_SUMMARY"
            echo "Data issues found — failing so GitHub emails you (data.json was still published unless marked CRITICAL)."
            exit 1
          fi
          echo '### ✅ Cash Till data check passed' >> "$GITHUB_STEP_SUMMARY"
